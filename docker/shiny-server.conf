# Configuración de Shiny Server para el contenedor.
#
# Escucha SIEMPRE en 3838 y solo en loopback: quien habla con el mundo es
# nginx, que va delante en el puerto que Railway diga y se encarga de la
# contraseña. Separarlos es lo que permite que la misma imagen sea pública o
# privada según el entorno, sin tocar esta configuración.

run_as shiny;

# Conexiones móviles. En iOS Safari basta con que la pantalla se apague para
# que el websocket se caiga; con estos valores el cliente lo mantiene vivo
# (heartbeat) y, si se cae, Shiny Server le guarda la sesión el tiempo
# suficiente para reengancharse (session$allowReconnect(TRUE) en cada app).
sockjs_heartbeat_delay 15;
sockjs_disconnect_delay 60;
http_keepalive_timeout 120;

# Los errores de R llegan al navegador en vez de "An error has occurred".
# En un despliegue de una sola persona eso es lo que se quiere: el mensaje
# real ahorra un viaje a los logs.
sanitize_errors off;

server {
  listen 3838 127.0.0.1;

  location / {
    site_dir /srv/shiny-server;

    # Los logs por app; el arranque los vuelca a stdout, que es lo único que
    # Railway lee.
    log_dir /var/log/shiny-server;

    # La portada la pone index.html. El índice automático de Shiny Server
    # enseña una lista cruda de carpetas y no queremos esa como cara pública.
    directory_index off;

    # Cuánto vive el proceso de R sin conexiones. Cinco minutos (lo que había)
    # significaba que volver al teléfono seis minutos después encontraba la
    # sesión muerta y el trabajo perdido. Treinta minutos cuesta memoria
    # mientras no hay nadie, pero es lo que hace que una vuelta a la app no
    # empiece de cero. El análisis además va en la URL, por si se pasa de eso.
    app_idle_timeout 1800;
  }
}
