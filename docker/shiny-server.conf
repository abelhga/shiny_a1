# Configuración de Shiny Server para el contenedor.
#
# Escucha SIEMPRE en 3838 y solo en loopback: quien habla con el mundo es
# nginx, que va delante en el puerto que Railway diga y se encarga de la
# contraseña. Separarlos es lo que permite que la misma imagen sea pública o
# privada según el entorno, sin tocar esta configuración.

run_as shiny;

# Los errores de R llegan al navegador en vez de "An error has occurred".
# En un despliegue de una sola persona eso es lo que se quiere: el mensaje
# real ahorra un viaje a los logs.
sanitize_errors off;

server {
  listen 3838 127.0.0.1;

  location / {
    site_dir /srv/shiny-server;

    # Los logs por app; el arranque los vuelca a stdout, que es lo único que
    # Railway lee.
    log_dir /var/log/shiny-server;

    # La portada la pone index.html. El índice automático de Shiny Server
    # enseña una lista cruda de carpetas y no queremos esa como cara pública.
    directory_index off;

    # Una pestaña olvidada deja un proceso de R vivo; con prophet cargado eso
    # son cientos de megas. Cinco minutos sin nadie y se recicla.
    app_idle_timeout 300;
  }
}
